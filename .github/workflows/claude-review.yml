name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    # Skip drafts and dependabot.
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 15 --model claude-sonnet-5"
          prompt: |
            Review this pull request.

            First, read the review instructions at `.claude/review-prompt.md` in this
            repository and follow them exactly, including its verdict rules and its
            requirement that the final line be one of MERGE, MERGE AFTER FIXES, or
            DO NOT MERGE.

            The diff to review is `git diff origin/main...HEAD`. Review only that diff.

            Post your review as a single pull request review comment. Attach inline
            annotations to the specific changed lines for each Blocker and Warning,
            and put the Summary and the final verdict line in the review body. Do not
            post more than one review. Do not modify any files.
